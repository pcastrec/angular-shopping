<h2>Search</h2>

<form (submit)="onSubmit($event)">
    <label for="search"></label>
    <input id="search" type="text" [formField]="form.search" />
    <select id="" [formField]="form.category">
        <option value="" hidden>Choose a category</option>
        <option value="">All</option>
        @for(option of productService.categories(); track option) {
        <option [value]="option">{{ option }}</option>
        }
    </select>
    <button type="submit">🔎</button>
</form>

<h2>Product List</h2>

@if(productService.loading()) {
<p>Loading ...</p>
} @else {
<ul>
    @for(item of products(); track item.title) {
    <li>
        <app-product-item [product]="item" />
    </li>
    }
</ul>
}
